[package]
name = "od-core"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"

[dependencies]
od-domain = { path = "../od-domain" }
chrono = "0.4"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls"] }
ureq = { version = "2", features = ["json"] }
serde_json = "1"
